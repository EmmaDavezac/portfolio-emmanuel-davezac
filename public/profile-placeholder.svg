<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f1420" />
      <stop offset="100%" stop-color="#141b2b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b134" />
      <stop offset="100%" stop-color="#8a651c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f2b134" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect width="400" height="400" fill="url(#glow)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.15" stroke="#232b3d" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Outer Ring with Amber accent -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#232b3d" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#amberGrad)" stroke-width="2" opacity="0.6" />

  <!-- Stylized Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="#1b2336" stroke="#2e3a54" stroke-width="2" />
  <!-- Body / Shoulders -->
  <path d="M110 320 C110 250 145 235 200 235 C255 235 290 250 290 320 Z" fill="#1b2336" stroke="#2e3a54" stroke-width="2" />

  <!-- Initials Badge / Monogram in Center -->
  <text x="200" y="165" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" fill="#f2b134" letter-spacing="-1">ED</text>

  <!-- Tech accent prompt -->
  <rect x="135" y="342" width="130" height="26" rx="13" fill="#0f1420" stroke="#f2b134" stroke-width="1" stroke-opacity="0.4" />
  <text x="200" y="359" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1">FULLSTACK DEV</text>
</svg>
