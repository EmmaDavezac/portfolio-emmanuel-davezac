<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f1420" />
      <stop offset="100%" stop-color="#141b2b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b134" />
      <stop offset="100%" stop-color="#8a651c" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f2b134" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#gridPattern)" />
  <rect width="800" height="500" fill="url(#cardGlow)" />

  <!-- Window Mockup Container -->
  <g transform="translate(100, 60)">
    <!-- Window Outer Frame -->
    <rect width="600" height="380" rx="14" fill="#0b101b" stroke="#253046" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 586 0 Q 600 0 600 14 L 600 42 L 0 42 Z" fill="#111827" />
    <line x1="0" y1="42" x2="600" y2="42" stroke="#253046" stroke-width="1" />
    
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="44" cy="21" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="64" cy="21" r="5.5" fill="#10b981" opacity="0.85" />
    
    <!-- Window Title / Prompt -->
    <text x="300" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#64748b" letter-spacing="0.5">preview.app // workspace</text>

    <!-- Inner Screen Area -->
    <g transform="translate(40, 70)">
      <!-- Blueprint Wireframe UI -->
      <!-- Sidebar skeleton -->
      <rect x="0" y="0" width="100" height="240" rx="8" fill="#161f30" stroke="#232f44" stroke-width="1" />
      <rect x="15" y="20" width="70" height="8" rx="4" fill="#334155" />
      <rect x="15" y="40" width="55" height="6" rx="3" fill="#253248" />
      <rect x="15" y="55" width="60" height="6" rx="3" fill="#253248" />
      <rect x="15" y="70" width="50" height="6" rx="3" fill="#253248" />
      <rect x="15" y="100" width="70" height="8" rx="4" fill="#334155" />
      <rect x="15" y="120" width="65" height="6" rx="3" fill="#253248" />
      <rect x="15" y="135" width="55" height="6" rx="3" fill="#253248" />

      <!-- Main Content skeleton -->
      <rect x="120" y="0" width="400" height="240" rx="8" fill="#0f1624" stroke="#232f44" stroke-width="1" />

      <!-- Centered Icon / Status Badge -->
      <g transform="translate(320, 95)">
        <!-- Circular Pulse Accent -->
        <circle cx="0" cy="0" r="38" fill="#1a2333" stroke="url(#amberGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
        <circle cx="0" cy="0" r="28" fill="#111827" stroke="#374151" stroke-width="1" />
        
        <!-- Code / Terminal Glyphs -->
        <path d="M -10 -7 L -17 0 L -10 7" fill="none" stroke="#f2b134" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 10 -7 L 17 0 L 10 7" fill="none" stroke="#f2b134" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="-3" y1="9" x2="3" y2="-9" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Status labels -->
      <text x="320" y="165" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9" letter-spacing="-0.3">
        Proyecto en Desarrollo
      </text>
      <text x="320" y="188" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#f59e0b" letter-spacing="0.5">
        &lt; Capturas e interfaz próximamente /&gt;
      </text>
      
      <!-- Decorative code line hints -->
      <rect x="150" y="215" width="140" height="5" rx="2.5" fill="#1e293b" />
      <rect x="300" y="215" width="90" height="5" rx="2.5" fill="#1e293b" />
      <rect x="400" y="215" width="80" height="5" rx="2.5" fill="#1e293b" />
    </g>
  </g>
</svg>
